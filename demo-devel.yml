compatible: sdk

product_info:
  name: 'App SDK Demo Bundle (development firmware)'
  code: 'EM400' # This is used for the default hostname

  manufacturer: 'TQ-Systems GmbH'
  manufacturer_url: 'https://www.tq-group.com/'

defaults:
  cache: true

apps:
  # Apps from the TQ-Systems package server
  access-token:
    version: '2.0.2'

  devel:
    arch: 'all'
    version: '1.4.4'

  json:
    version: '3.0.1'

  smart-meter:
    version: '3.0.2'

  # ui-container is replaced with its locally built open source variant (see below)
  ui-container: null

  upnp:
    version: '2.1.1'

  # Locally built apps
  go-demo:
    version: '1.0.2'
    url: file://${TQEM_BASE_DEPLOY_PATH}/snapshots/apps/{app}/v{version}/{app}_{version}_{arch}.empkg

  open-ui-container:
    arch: 'all'
    version: '1.0.3'
    url: file://${TQEM_BASE_DEPLOY_PATH}/snapshots/apps/{app}/v{version}/{app}_{version}_{arch}.empkg
